<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="基于艾宾浩斯遗忘曲线的背诵复习计划工具">
  <title>背诵规划表 · 艾宾浩斯复习计划</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232f5d50'/%3E%3Cpath d='M18 21h28M18 32h28M18 43h18' stroke='%23ffffff' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-name">背诵规划表</span>
          <span class="brand-desc">艾宾浩斯复习</span>
        </div>
        <nav class="tabs" aria-label="主导航">
          <button class="tab" type="button" data-view="today">今日复习</button>
          <button class="tab" type="button" data-view="entries">条目管理</button>
          <button class="tab" type="button" data-view="subjects">科目设置</button>
          <button class="tab" type="button" data-view="data">数据备份</button>
        </nav>
      </div>
    </header>

    <main id="main">
      <section class="view" id="view-today" aria-live="polite"></section>
      <section class="view" id="view-entries" hidden></section>
      <section class="view" id="view-subjects" hidden></section>
      <section class="view" id="view-data" hidden></section>
    </main>

    <footer class="site-foot">
      <span>数据保存在本机浏览器中，建议定期在「数据备份」里导出备份。</span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" hidden role="status"></div>

  <script src="app.js"></script>
</body>
</html>
